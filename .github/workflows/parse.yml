name: Parse program

# Regenerate src/data/program.json from the trainer's Google Doc (incremental:
# keeps existing sessions, appends new ones). Runs 4×/day and on demand.
on:
  schedule:
    # GitHub cron is UTC and does NOT observe daylight saving. Times target Miami
    # EDT (UTC-4, summer); in winter (EST, UTC-5) they land ~1h earlier locally.
    - cron: '0 11 * * *' # 07:00 Miami
    - cron: '0 17 * * *' # 13:00 Miami
    - cron: '0 22 * * *' # 18:00 Miami
    - cron: '0 4 * * *'  # 00:00 Miami (midnight)
  workflow_dispatch: {}

jobs:
  parse:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run parse
      - name: Commit if program.json changed
        run: |
          if git diff --quiet -- src/data/program.json; then
            echo "No new sessions."
          else
            git config user.name "program-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/data/program.json
            git commit -m "data: parse new sessions from the Doc [skip ci]"
            git push
          fi
