name: Parse program

# Regenerate src/data/program.json from the trainer's Google Doc (incremental:
# keeps existing sessions, appends new ones). Runs daily and on demand.
on:
  schedule:
    - cron: '0 6 * * *' # 06:00 UTC daily
  workflow_dispatch: {}

jobs:
  parse:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run parse
      - name: Commit if program.json changed
        run: |
          if git diff --quiet -- src/data/program.json; then
            echo "No new sessions."
          else
            git config user.name "program-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/data/program.json
            git commit -m "data: parse new sessions from the Doc [skip ci]"
            git push
          fi
