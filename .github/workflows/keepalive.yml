name: Supabase keep-alive

# Free-tier Supabase projects auto-pause after 7 consecutive days with no API
# requests. This app is local-first — workouts log to localStorage and only sync
# to Supabase occasionally — so the backend can sit idle for a week and get paused,
# which withdraws its subdomain from DNS and breaks login (src/screens/login.ts
# calls supabase.auth.signInWithPassword against that host).
#
# A daily no-op request to the project's REST root counts as activity and resets
# the 7-day idle timer, so the project never pauses. Daily (not every-N-days) gives
# ~7 chances before a pause, surviving any scheduled runs GitHub drops under load.
#
# NOTE: GitHub only runs `schedule:` triggers from the DEFAULT branch — this does
# nothing until merged to main. Requires two repo secrets (SUPABASE_URL,
# SUPABASE_ANON_KEY); the anon key is public-safe (it already ships in the client
# bundle). Use the "Run workflow" button (workflow_dispatch) to test on demand.
on:
  schedule:
    - cron: '0 8 * * *' # daily, 08:00 UTC
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST root
        env:
          URL: ${{ secrets.SUPABASE_URL }}
          KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$URL" ] || [ -z "$KEY" ]; then
            echo "::error::SUPABASE_URL / SUPABASE_ANON_KEY secrets are not set."
            exit 1
          fi
          code=$(curl -sS -o /dev/null -w '%{http_code}' \
            --retry 3 --retry-delay 10 --max-time 30 \
            "$URL/rest/v1/" -H "apikey: $KEY")
          echo "REST root returned HTTP $code"
          # Any HTTP response (2xx/4xx) proves the project is awake — that's what
          # resets the idle timer. 000 (no connection) or 5xx means it's down or
          # paused; fail loudly so the red run + email flags it.
          if [ "$code" = "000" ] || [ "$code" -ge 500 ]; then
            echo "::error::Supabase did not respond (HTTP $code) — project may be paused."
            exit 1
          fi
          echo "Project is awake; idle timer reset."
